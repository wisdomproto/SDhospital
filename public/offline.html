<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연결이 끊겼습니다 · SD동물의료센터</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f7;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#1a2b3c;padding:24px}
  .box{text-align:center;max-width:320px}
  .ico{width:72px;height:72px;border-radius:24px;background:#0f9b8e;display:grid;place-items:center;
    margin:0 auto 20px;font-size:34px}
  h1{font-size:1.15rem;margin:0 0 10px}
  p{margin:0 0 20px;font-size:.9rem;line-height:1.7;color:#5b6b7d}
  button{border:0;background:#0f9b8e;color:#fff;font:inherit;font-weight:700;
    padding:13px 26px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="ico">🐾</div>
    <h1>연결이 끊겼습니다</h1>
    <p>진료 기록은 개인정보라 기기에 저장해두지 않습니다.<br>인터넷에 연결한 뒤 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
